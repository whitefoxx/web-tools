<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#1A1236"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F6BFF"/>
      <stop offset="1" stop-color="#A44DFF"/>
    </linearGradient>
    <linearGradient id="globe" gradientUnits="userSpaceOnUse" x1="91" y1="83" x2="421" y2="413">
      <stop offset="0" stop-color="#4F6BFF"/>
      <stop offset="1" stop-color="#A44DFF"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4F6BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4F6BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A44DFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#A44DFF" stop-opacity="0"/>
    </radialGradient>
  </defs><rect width="1280" height="800" fill="url(#bg)"/><circle cx="640" cy="720" r="720" fill="url(#glowP)"/><g transform="translate(72 60) scale(0.08984375)">
    <g transform="translate(256 256) scale(1.43) translate(-256 -248)">
      <g transform="translate(256 248)" stroke="url(#globe)" stroke-width="28.6" fill="none" stroke-linecap="round">
        <circle cx="0" cy="0" r="165"/>
        <ellipse cx="0" cy="0" rx="72" ry="165" stroke-opacity="0.75"/>
        <line x1="-165" y1="0" x2="165" y2="0" stroke-opacity="0.75"/>
      </g>
      <g transform="translate(303 315) scale(1.62) translate(-329 -341)">
        <path d="M 300 272 L 300 384 L 330 354 L 386 354 Z" fill="#F5A623"/>
      </g>
    </g>
  </g><text x="130" y="93" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0.5" opacity="1">WebCLI</text><text x="72" y="190" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">Up and running in three steps</text><circle cx="104" cy="268" r="26" fill="url(#brand)"/><text x="104" y="277" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="#F5F7FF" text-anchor="middle" letter-spacing="0" opacity="1">1</text><text x="150" y="262" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">Install WebCLI</text><text x="150" y="298" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">Add it from the Chrome Web Store. It runs headless — only a small status popup.</text><circle cx="104" cy="386" r="26" fill="url(#brand)"/><text x="104" y="395" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="#F5F7FF" text-anchor="middle" letter-spacing="0" opacity="1">2</text><text x="150" y="380" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">Start the local daemon</text><text x="150" y="416" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">One command spins up the bridge on port 9376. WebCLI auto-connects within a minute.</text><circle cx="104" cy="504" r="26" fill="url(#brand)"/><text x="104" y="513" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="#F5F7FF" text-anchor="middle" letter-spacing="0" opacity="1">3</text><text x="150" y="498" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">Point your agent at it</text><text x="150" y="534" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">Claude Code, Codex or anything that can curl now drives your Chrome through WebCLI.</text><rect x="72" y="618" width="1136" height="120" rx="14" fill="#05070F" stroke="rgba(255,255,255,0.10)"/><circle cx="96" cy="642" r="6" fill="#ff5f56"/><circle cx="116" cy="642" r="6" fill="#ffbd2e"/><circle cx="136" cy="642" r="6" fill="#27c93f"/><text x="100" y="690" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="24" font-weight="400" fill="#8CF5A0" text-anchor="start" letter-spacing="0" opacity="1">$ npx -y github:whitefoxx/web-tools</text><text x="100" y="720" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="18" font-weight="400" fill="#727C9C" text-anchor="start" letter-spacing="0" opacity="1"># WebCLI daemon listening on :9376  →  extension connects automatically</text></svg>
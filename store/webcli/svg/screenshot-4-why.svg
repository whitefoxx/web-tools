<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#1A1236"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F6BFF"/>
      <stop offset="1" stop-color="#A44DFF"/>
    </linearGradient>
    <linearGradient id="globe" gradientUnits="userSpaceOnUse" x1="91" y1="83" x2="421" y2="413">
      <stop offset="0" stop-color="#4F6BFF"/>
      <stop offset="1" stop-color="#A44DFF"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4F6BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4F6BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A44DFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#A44DFF" stop-opacity="0"/>
    </radialGradient>
  </defs><rect width="1280" height="800" fill="url(#bg)"/><circle cx="240" cy="720" r="640" fill="url(#glowB)"/><circle cx="1080" cy="120" r="560" fill="url(#glowP)"/><g transform="translate(72 60) scale(0.08984375)">
    <g transform="translate(256 256) scale(1.43) translate(-256 -248)">
      <g transform="translate(256 248)" stroke="url(#globe)" stroke-width="28.6" fill="none" stroke-linecap="round">
        <circle cx="0" cy="0" r="165"/>
        <ellipse cx="0" cy="0" rx="72" ry="165" stroke-opacity="0.75"/>
        <line x1="-165" y1="0" x2="165" y2="0" stroke-opacity="0.75"/>
      </g>
      <g transform="translate(303 315) scale(1.62) translate(-329 -341)">
        <path d="M 300 272 L 300 384 L 330 354 L 386 354 Z" fill="#F5A623"/>
      </g>
    </g>
  </g><text x="130" y="93" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0.5" opacity="1">WebCLI</text><text x="72" y="186" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">Why WebCLI</text><text x="72" y="230" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">A focused provider, not another agent framework.</text><rect x="72" y="274" width="548" height="132" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><circle cx="112" cy="314" r="15" fill="none" stroke="url(#brand)" stroke-width="4"/><path d="M 105 314 L 110 319 L 120 308" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="322" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">Your real Chrome session</text><text x="142" y="356" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">Logged-in and human-like — sails past the bot</text><text x="142" y="384" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">walls that block headless scrapers.</text><rect x="660" y="274" width="548" height="132" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><circle cx="700" cy="314" r="15" fill="none" stroke="url(#brand)" stroke-width="4"/><path d="M 693 314 L 698 319 L 708 308" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="730" y="322" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">No in-browser agent</text><text x="730" y="356" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">A pure browser-control provider. Bring your</text><text x="730" y="384" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">own model and orchestration.</text><rect x="72" y="434" width="548" height="132" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><circle cx="112" cy="474" r="15" fill="none" stroke="url(#brand)" stroke-width="4"/><path d="M 105 474 L 110 479 L 120 468" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="482" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">One way in</text><text x="142" y="516" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">A daemon bound to 127.0.0.1, driven over plain</text><text x="142" y="544" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">HTTP. No web page can reach it.</text><rect x="660" y="434" width="548" height="132" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><circle cx="700" cy="474" r="15" fill="none" stroke="url(#brand)" stroke-width="4"/><path d="M 693 474 L 698 479 L 708 468" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="730" y="482" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">Tiny &amp; side-by-side</text><text x="730" y="516" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">Well under a megabyte, generic tools only.</text><text x="730" y="544" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">Runs next to the full Web Agent extension.</text><rect x="72" y="594" width="548" height="132" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><circle cx="112" cy="634" r="15" fill="none" stroke="url(#brand)" stroke-width="4"/><path d="M 105 634 L 110 639 L 120 628" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="642" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">Cookie-authed fetch</text><text x="142" y="676" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">Raw fetch_url rides your cookies + CORS-free</text><text x="142" y="704" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">host access for JSON, RSS, sitemaps.</text><rect x="660" y="594" width="548" height="132" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><circle cx="700" cy="634" r="15" fill="none" stroke="url(#brand)" stroke-width="4"/><path d="M 693 634 L 698 639 L 708 628" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="730" y="642" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">Auto-reconnect</text><text x="730" y="676" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">A 1-minute alarm redial connects within a</text><text x="730" y="704" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">minute of your daemon starting.</text></svg>
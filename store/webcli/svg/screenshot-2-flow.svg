<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#1A1236"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F6BFF"/>
      <stop offset="1" stop-color="#A44DFF"/>
    </linearGradient>
    <linearGradient id="globe" gradientUnits="userSpaceOnUse" x1="91" y1="83" x2="421" y2="413">
      <stop offset="0" stop-color="#4F6BFF"/>
      <stop offset="1" stop-color="#A44DFF"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4F6BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4F6BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A44DFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#A44DFF" stop-opacity="0"/>
    </radialGradient>
  </defs><rect width="1280" height="800" fill="url(#bg)"/><circle cx="640" cy="700" r="700" fill="url(#glowB)"/><g transform="translate(72 60) scale(0.08984375)">
    <g transform="translate(256 256) scale(1.43) translate(-256 -248)">
      <g transform="translate(256 248)" stroke="url(#globe)" stroke-width="28.6" fill="none" stroke-linecap="round">
        <circle cx="0" cy="0" r="165"/>
        <ellipse cx="0" cy="0" rx="72" ry="165" stroke-opacity="0.75"/>
        <line x1="-165" y1="0" x2="165" y2="0" stroke-opacity="0.75"/>
      </g>
      <g transform="translate(303 315) scale(1.62) translate(-329 -341)">
        <path d="M 300 272 L 300 384 L 330 354 L 386 354 Z" fill="#F5A623"/>
      </g>
    </g>
  </g><text x="130" y="93" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0.5" opacity="1">WebCLI</text><text x="72" y="190" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="0" opacity="1">Your agent drives your real browser</text><text x="72" y="236" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#AEB7D4" text-anchor="start" letter-spacing="0" opacity="1">Locally, through one small daemon on your own machine. Nothing leaves it.</text><rect x="74" y="360" width="250" height="182" rx="20" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><rect x="74" y="360" width="6" height="182" rx="3" fill="#F5A623"/><text x="199" y="418" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#F5F7FF" text-anchor="middle" letter-spacing="0" opacity="1">AI agent</text><text x="199" y="456" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#AEB7D4" text-anchor="middle" letter-spacing="0" opacity="1">Claude Code</text><text x="199" y="486" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#AEB7D4" text-anchor="middle" letter-spacing="0" opacity="1">Codex</text><text x="199" y="516" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#AEB7D4" text-anchor="middle" letter-spacing="0" opacity="1">any CLI agent</text><line x1="330" y1="451" x2="354" y2="451" stroke="#727C9C" stroke-width="3"/><path d="M 354 443 L 368 451 L 354 459 Z" fill="#AEB7D4"/><rect x="368" y="360" width="250" height="182" rx="20" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><rect x="368" y="360" width="6" height="182" rx="3" fill="#4F6BFF"/><text x="493" y="418" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#F5F7FF" text-anchor="middle" letter-spacing="0" opacity="1">Local daemon</text><text x="493" y="456" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#AEB7D4" text-anchor="middle" letter-spacing="0" opacity="1">localhost :9376</text><text x="493" y="486" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#AEB7D4" text-anchor="middle" letter-spacing="0" opacity="1">plain HTTP</text><line x1="624" y1="451" x2="648" y2="451" stroke="#727C9C" stroke-width="3"/><path d="M 648 443 L 662 451 L 648 459 Z" fill="#AEB7D4"/><rect x="662" y="360" width="250" height="182" rx="20" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><rect x="662" y="360" width="6" height="182" rx="3" fill="#A44DFF"/><text x="787" y="418" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#F5F7FF" text-anchor="middle" letter-spacing="0" opacity="1">WebCLI</text><text x="787" y="456" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#AEB7D4" text-anchor="middle" letter-spacing="0" opacity="1">Chrome extension</text><text x="787" y="486" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#AEB7D4" text-anchor="middle" letter-spacing="0" opacity="1">no in-page agent</text><line x1="918" y1="451" x2="942" y2="451" stroke="#727C9C" stroke-width="3"/><path d="M 942 443 L 956 451 L 942 459 Z" fill="#AEB7D4"/><rect x="956" y="360" width="250" height="182" rx="20" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.09)"/><rect x="956" y="360" width="6" height="182" rx="3" fill="#F5A623"/><text x="1081" y="418" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#F5F7FF" text-anchor="middle" letter-spacing="0" opacity="1">Your Chrome</text><text x="1081" y="456" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#AEB7D4" text-anchor="middle" letter-spacing="0" opacity="1">real tabs</text><text x="1081" y="486" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#AEB7D4" text-anchor="middle" letter-spacing="0" opacity="1">logged-in session</text><text x="640" y="640" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#AEB7D4" text-anchor="middle" letter-spacing="0" opacity="1">Bidirectional: the agent calls a tool → WebCLI runs it in Chrome → the result flows back.</text><text x="640" y="690" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#727C9C" text-anchor="middle" letter-spacing="0" opacity="1">Bring your own model. WebCLI is the hands, not the brain.</text></svg>
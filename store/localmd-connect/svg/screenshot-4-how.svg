      <stop offset="1" stop-color="#2F6FED"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowD" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2F6FED" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2F6FED" stop-opacity="0"/>
    </radialGradient>
  </defs><rect width="1280" height="800" fill="url(#bg)"/><circle cx="640" cy="700" r="700" fill="url(#glowB)"/><g transform="translate(72 60) scale(0.359375)">
    <rect width="128" height="128" rx="28" fill="url(#brand)"/>
    <g fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 36H36v56h14"/>
      <path d="M78 36h14v56H78"/>
    </g>
    <path d="M70 32 L52 70 h11 L58 96 L78 56 h-11 Z" fill="#fff"/>
  </g><text x="134" y="93" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#F2F7FF" text-anchor="start" letter-spacing="0.3" opacity="1">localmd Connect</text><text x="72" y="190" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#F2F7FF" text-anchor="start" letter-spacing="0" opacity="1">No daemon. No config. No keys.</text><text x="72" y="236" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#A9BFDC" text-anchor="start" letter-spacing="0" opacity="1">localmd.app talks to the extension directly, inside your browser.</text><rect x="114" y="360" width="300" height="168" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(120,175,255,0.16)"/><rect x="114" y="360" width="6" height="168" rx="3" fill="url(#brand)"/><text x="264" y="422" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#F2F7FF" text-anchor="middle" letter-spacing="0" opacity="1">localmd.app</text><text x="264" y="464" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#A9BFDC" text-anchor="middle" letter-spacing="0" opacity="1">your KB agent</text><text x="264" y="494" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#A9BFDC" text-anchor="middle" letter-spacing="0" opacity="1">in this browser</text><path d="M 436 444 L 468 444" stroke="#6E86A6" stroke-width="3"/><path d="M 460 436 L 470 444 L 460 452" fill="#6E86A6"/><rect x="490" y="360" width="300" height="168" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(120,175,255,0.16)"/><rect x="490" y="360" width="6" height="168" rx="3" fill="url(#brand)"/><text x="640" y="422" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#F2F7FF" text-anchor="middle" letter-spacing="0" opacity="1">localmd Connect</text><text x="640" y="464" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#A9BFDC" text-anchor="middle" letter-spacing="0" opacity="1">this extension</text><text x="640" y="494" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#A9BFDC" text-anchor="middle" letter-spacing="0" opacity="1">tools + adapters</text><path d="M 812 444 L 844 444" stroke="#6E86A6" stroke-width="3"/><path d="M 836 436 L 846 444 L 836 452" fill="#6E86A6"/><rect x="866" y="360" width="300" height="168" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(120,175,255,0.16)"/><rect x="866" y="360" width="6" height="168" rx="3" fill="url(#brand)"/><text x="1016" y="422" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#F2F7FF" text-anchor="middle" letter-spacing="0" opacity="1">Your Chrome</text><text x="1016" y="464" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#A9BFDC" text-anchor="middle" letter-spacing="0" opacity="1">real tabs</text><text x="1016" y="494" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#A9BFDC" text-anchor="middle" letter-spacing="0" opacity="1">logged-in</text><text x="640" y="634" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#A9BFDC" text-anchor="middle" letter-spacing="0" opacity="1">One site can reach it — localmd.app. That list is built in, not a setting.</text><text x="640" y="682" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#6E86A6" text-anchor="middle" letter-spacing="0" opacity="1">Nothing is sent anywhere else. The browser is the whole system.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081221"/>
      <stop offset="1" stop-color="#0E2743"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#2F6FED"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowD" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2F6FED" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2F6FED" stop-opacity="0"/>
    </radialGradient>
  </defs><rect width="1280" height="800" fill="url(#bg)"/><circle cx="980" cy="120" r="620" fill="url(#glowB)"/><g transform="translate(72 60) scale(0.359375)">
    <rect width="128" height="128" rx="28" fill="url(#brand)"/>
    <g fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 36H36v56h14"/>
      <path d="M78 36h14v56H78"/>
    </g>
    <path d="M70 32 L52 70 h11 L58 96 L78 56 h-11 Z" fill="#fff"/>
  </g><text x="134" y="93" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#F2F7FF" text-anchor="start" letter-spacing="0.3" opacity="1">localmd Connect</text><text x="72" y="190" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#F2F7FF" text-anchor="start" letter-spacing="0" opacity="1">One key, and it is in your notes</text><text x="72" y="236" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#A9BFDC" text-anchor="start" letter-spacing="0" opacity="1">Capture what you are reading — the agent writes it up for you.</text><g>
    <rect x="72" y="296" width="198" height="40" rx="20" fill="rgba(88,166,255,0.12)" stroke="rgba(88,166,255,0.30)"/>
    <text x="171" y="322.8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#BBD6FF" text-anchor="middle" letter-spacing="0" opacity="1">The whole page</text>
  </g><g>
    <rect x="282" y="296" width="258" height="40" rx="20" fill="rgba(88,166,255,0.12)" stroke="rgba(88,166,255,0.30)"/>
    <text x="411" y="322.8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#BBD6FF" text-anchor="middle" letter-spacing="0" opacity="1">Just your selection</text>
  </g><g>
    <rect x="552" y="296" width="234" height="40" rx="20" fill="rgba(88,166,255,0.12)" stroke="rgba(88,166,255,0.30)"/>
    <text x="669" y="322.8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#BBD6FF" text-anchor="middle" letter-spacing="0" opacity="1">A region you drag</text>
  </g><g>
    <rect x="798" y="296" width="246" height="40" rx="20" fill="rgba(88,166,255,0.12)" stroke="rgba(88,166,255,0.30)"/>
    <text x="921" y="322.8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#BBD6FF" text-anchor="middle" letter-spacing="0" opacity="1">A PDF, as the file</text>
  </g><g>
    <rect x="72" y="348" width="306" height="40" rx="20" fill="rgba(88,166,255,0.12)" stroke="rgba(88,166,255,0.30)"/>
    <text x="225" y="374.8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#BBD6FF" text-anchor="middle" letter-spacing="0" opacity="1">Every tab in the window</text>
  </g><rect x="72" y="452" width="1136" height="190" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(120,175,255,0.16)"/><text x="104" y="504" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="26" font-weight="400" fill="#58A6FF" text-anchor="start" letter-spacing="0" opacity="1">Alt+Shift+S</text><text x="354" y="504" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="400" fill="#A9BFDC" text-anchor="start" letter-spacing="0" opacity="1">clip this page into today’s note</text><text x="104" y="556" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="26" font-weight="400" fill="#58A6FF" text-anchor="start" letter-spacing="0" opacity="1">Alt+Shift+A</text><text x="354" y="556" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="400" fill="#A9BFDC" text-anchor="start" letter-spacing="0" opacity="1">drag a rectangle, annotate it, send it</text><text x="104" y="604" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#6E86A6" text-anchor="start" letter-spacing="0" opacity="1">Highlight as you read — your marks are still there next visit.</text><text x="640" y="720" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#A9BFDC" text-anchor="middle" letter-spacing="0" opacity="1">Works on the sites that need you signed in — it is your own browser session.</text></svg>